{% extends 'base.html' %}

{% block title %}Add Product - ZOM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-success mb-3">Add New Organic Product</h3>
                <p class="text-muted">Fill in details for the product you wish to list on the Zimbabwe Organic Marketplace.</p>
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Save Product</button>
                        <a href="{% url 'products:seller_products' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
