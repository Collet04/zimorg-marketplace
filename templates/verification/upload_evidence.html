{% extends 'base.html' %}

{% block title %}Upload Evidence - ZOM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-success mb-3">Upload Supporting Evidence</h3>
                <p class="text-muted">Provide valid documentation (certificates, inspection sheets, etc.) to strengthen your trust profile.</p>
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Upload Document</button>
                        <a href="{% url 'verification:evidence_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
