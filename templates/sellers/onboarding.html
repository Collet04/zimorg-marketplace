{% extends 'base.html' %}

{% block title %}Seller Onboarding - ZOM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-success mb-3">Farm / Business Onboarding</h3>
                <p class="text-muted">Provide your organization and farming details so our verifiers can review your organic status.</p>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Save Profile & Submit for Verification</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
