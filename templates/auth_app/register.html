{% extends 'base.html' %}

{% block title %}Register - ZOM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center text-success mb-4">Create Your Account</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success">Register</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <small>Already have an account? <a href="{% url 'auth_app:login' %}" class="text-success">Login here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
